# TEMPORARY (about-page branch only): builds the site and saves screenshots for review. Removed before merge.
name: Preview screenshots
on:
  push:
    branches: [about-page]
permissions:
  contents: write
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Start the site on isolated test data
        run: |
          export BOTA_DATA_DIR="$RUNNER_TEMP/bota-data"
          node scripts/order-key.mjs
          APP_ORIGIN=http://127.0.0.1:3000 nohup node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
      - name: Screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$GITHUB_WORKSPACE/.github/preview/shots.mjs" "$RUNNER_TEMP/shots"
      - if: always()
        name: Publish screenshots to the preview-shots branch (temporary)
        run: |
          cp "$RUNNER_TEMP/next.log" "$RUNNER_TEMP/shots/" 2>/dev/null || true
          cd "$RUNNER_TEMP/shots"
          git init -q -b preview-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "shots ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview-shots
